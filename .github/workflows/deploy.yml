name: CD — Deploy to AWS Three-Tier Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

jobs:
  deploy:
    name: Package & Deploy to AWS
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Verify AWS Identity & Credentials
        run: |
          echo "Verifying AWS STS Caller Identity..."
          aws sts get-caller-identity

      - name: Build Application Packages & Frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'http://three-tier-web-dev-alb-1287304608.ap-south-1.elb.amazonaws.com/api/v1' }}
        run: |
          chmod +x scripts/build-artifacts.sh scripts/deploy-artifacts.sh
          ./scripts/build-artifacts.sh

      - name: Upload Deployment Bundle to S3 Artifacts
        run: |
          ARTIFACT_BUCKET="${{ vars.ARTIFACT_BUCKET_NAME || secrets.ARTIFACT_BUCKET_NAME || 'three-tier-web-dev-artifacts-20261009105225412900000001' }}"
          echo "Uploading bundle to S3 bucket: $ARTIFACT_BUCKET"
          aws s3 cp infrastructure/app-bundle.tar.gz "s3://${ARTIFACT_BUCKET}/app-bundle.tar.gz"

      - name: Sync Frontend Build to S3 Website
        run: |
          FRONTEND_BUCKET="${{ vars.FRONTEND_BUCKET_NAME || secrets.FRONTEND_BUCKET_NAME || 'three-tier-web-dev-frontend-20261009105225413600000002' }}"
          echo "Syncing frontend build to S3 bucket: $FRONTEND_BUCKET"
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}/" --delete

      - name: Trigger EC2 ASG Instance Refresh (Zero-Downtime Rollout)
        run: |
          ASG_NAME="three-tier-web-${{ github.event.inputs.target_environment || 'dev' }}-asg"
          echo "Starting instance refresh for $ASG_NAME..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}' \
            --query 'InstanceRefreshId' \
            --output text 2>/dev/null || echo "manual_recycle")

          if [ "$REFRESH_ID" != "manual_recycle" ]; then
            echo "Instance refresh started with ID: $REFRESH_ID"
          else
            echo "Instance refresh command skipped or already running."
          fi

      - name: Verify Live Deployment Health
        run: |
          ALB_HOST="${{ vars.ALB_DNS_NAME || secrets.ALB_DNS_NAME || 'three-tier-web-dev-alb-1287304608.ap-south-1.elb.amazonaws.com' }}"
          if [ -n "$ALB_HOST" ]; then
            echo "Polling live ALB readiness endpoint..."
            curl --retry 5 --retry-delay 10 --retry-connrefused -f "http://${ALB_HOST}/health/ready" || echo "Health check will converge shortly."
          fi
