name: CD — Deploy to AWS Three-Tier Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

jobs:
  deploy:
    name: Package & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Build Application Packages & Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || format('http://{0}/api/v1', secrets.ALB_DNS_NAME) }}
        run: |
          chmod +x scripts/build-artifacts.sh scripts/deploy-artifacts.sh
          ./scripts/build-artifacts.sh

      - name: Upload Deployment Bundle to S3 Artifacts
        run: |
          ARTIFACT_BUCKET="${{ secrets.ARTIFACT_BUCKET_NAME }}"
          aws s3 cp infrastructure/app-bundle.tar.gz "s3://${ARTIFACT_BUCKET}/app-bundle.tar.gz"

      - name: Sync Frontend Build to S3 Website
        run: |
          FRONTEND_BUCKET="${{ secrets.FRONTEND_BUCKET_NAME }}"
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}/" --delete

      - name: Trigger EC2 ASG Instance Refresh (Zero-Downtime Rollout)
        run: |
          ASG_NAME="three-tier-web-${{ github.event.inputs.target_environment || 'dev' }}-asg"
          echo "Starting instance refresh for $ASG_NAME..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}' \
            --query 'InstanceRefreshId' \
            --output text 2>/dev/null || echo "manual_recycle")

          if [ "$REFRESH_ID" != "manual_recycle" ]; then
            echo "Instance refresh started with ID: $REFRESH_ID"
          else
            echo "Instance refresh command skipped or already running."
          fi

      - name: Verify Live Deployment Health
        run: |
          ALB_HOST="${{ secrets.ALB_DNS_NAME }}"
          if [ -n "$ALB_HOST" ]; then
            echo "Polling live ALB readiness endpoint..."
            curl --retry 5 --retry-delay 10 --retry-connrefused -f "http://${ALB_HOST}/health/ready" || echo "Health check will converge shortly."
          fi
