name: Docker — Build & Push to Amazon ECR

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials & Log in to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        run: |
          echo "Authenticating with AWS ECR in region ${AWS_REGION}..."
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Backend Docker Image
        run: |
          echo "Building backend container: ${ECR_REGISTRY}/three-tier-web-dev-backend:${IMAGE_TAG}"
          docker build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "${ECR_REGISTRY}/three-tier-web-dev-backend:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/three-tier-web-dev-backend:latest" \
            ./backend

          echo "Pushing backend container to Amazon ECR..."
          docker push "${ECR_REGISTRY}/three-tier-web-dev-backend:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/three-tier-web-dev-backend:latest"

      - name: Build & Push Frontend Docker Image
        run: |
          echo "Building frontend container: ${ECR_REGISTRY}/three-tier-web-dev-frontend:${IMAGE_TAG}"
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "${ECR_REGISTRY}/three-tier-web-dev-frontend:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/three-tier-web-dev-frontend:latest" \
            ./frontend

          echo "Pushing frontend container to Amazon ECR..."
          docker push "${ECR_REGISTRY}/three-tier-web-dev-frontend:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/three-tier-web-dev-frontend:latest"

      - name: Output ECR Registry Deployment Summary
        run: |
          echo "### 🚀 Amazon ECR Images Successfully Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image**: \`${ECR_REGISTRY}/three-tier-web-dev-backend:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image**: \`${ECR_REGISTRY}/three-tier-web-dev-frontend:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Tags Updated**: \`three-tier-web-dev-backend:latest\`, \`three-tier-web-dev-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
